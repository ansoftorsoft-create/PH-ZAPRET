cd ~/PH-ZAPRET

cat << 'EOF' > .github/workflows/build.yml
name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust Toolchain & Targets for Mozilla Plugin
        run: |
          rustup default stable
          rustup target add armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          # Находим путь к NDK в GitHub Actions
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -n 1)
          echo "Using NDK from: $NDK_PATH"
          
          # Экспортируем переменные для Rust плагина
          export ANDROID_NDK_HOME=$NDK_PATH
          export CARGO_NDK_ANDROID_NDK_HOME=$NDK_PATH
          
          ./gradlew assembleDebug --no-daemon

      - name: Release APK
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
